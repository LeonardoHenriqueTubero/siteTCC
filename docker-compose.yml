services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - ./sql/TCCdatabase.sql:/docker-entrypoint-initdb.d/TCCdatabase.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
